[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexterm"
version = "0.1.2"
description = "A local developer workspace CLI for managing projects, environments, repositories, and development workflows from an interactive terminal."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [
    { name = "Tutun Mahapatra" }
]
keywords = ["cli", "terminal", "developer-tools", "workspace", "project-management", "git", "automation", "python", "shell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "click>=8.1",
    "tomli>=2.0; python_version < '3.11'",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]
ai = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/Mr-Anonymous-Guy/Nexterm"
Repository = "https://github.com/Mr-Anonymous-Guy/Nexterm.git"
Issues = "https://github.com/Mr-Anonymous-Guy/Nexterm/issues"
Documentation = "https://github.com/Mr-Anonymous-Guy/Nexterm/blob/main/README.md"
Changelog = "https://github.com/Mr-Anonymous-Guy/Nexterm/blob/main/CHANGELOG.md"

[project.scripts]
nexterm = "nexterm.cli:main"
workspace = "nexterm.cli:main"
workspcae = "nexterm.cli:main"
developeros = "nexterm.cli:main"
work = "nexterm.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["nexterm"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.git",
    "/.github",
    "/.pytest_cache",
    "/dist",
    "/build",
    "/*.db",
    "/*.log",
    "/.env*",
    "/tests",
]

