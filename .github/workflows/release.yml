name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  validate-and-build:
    name: Validate Release & Build Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build & test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install .[dev]

      - name: Extract Tag Version
        id: get_version
        run: |
          TAG_NAME="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG_NAME#v}"
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Run Release Validation Suite (Git, Version, Tests, Build, Metadata, Secrets, Venv)
        run: |
          python scripts/release_check.py ${{ steps.get_version.outputs.tag_name }}

      - name: Generate SHA256SUMS.txt
        run: |
          (cd dist && sha256sum *.whl *.tar.gz > ../SHA256SUMS.txt)
          cat SHA256SUMS.txt

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*.whl
            dist/*.tar.gz

      - name: Upload SHA256SUMS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-checksums
          path: SHA256SUMS.txt

  publish-pypi:
    name: Publish to PyPI (Trusted Publisher OIDC)
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish Package to PyPI via OIDC
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          # Zero PyPI API tokens required! Uses GitHub OIDC Trusted Publishing identity.

  github-release:
    name: Create GitHub Release
    needs: [validate-and-build, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Download Checksums Artifact
        uses: actions/download-artifact@v4
        with:
          name: release-checksums
          path: ./

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: NexTerm ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/*.whl
            dist/*.tar.gz
            SHA256SUMS.txt
